<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index Example</title>
    <style>
        img{
            position: absolute;
            height: 200px;
            width: 300px;
            top:0px;
            left:0px;
            z-index: -1;
        }
    </style>
</head>
<body>
    <h1>Z-index Example</h1>
    <img src="https://i0.wp.com/picjumbo.com/wp-content/uploads/silhouettes-of-hawaiian-palms-at-a-gorgeous-sunset-free-image.jpeg?w=2210&quality=70" alt="Image 1">

</body>
</html>
