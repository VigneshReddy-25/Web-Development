<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-example</title>
    <style>
        .box{
            width: 300px;
            height: 200px;
            padding: 20px;
            border: 5px solid black;
            margin: 10px;
            background-color: lightblue;
        }
        .box1{
            border: 2px solid red;
            margin: 0px;
        }
        h1{
            border: 2px solid green;
            padding: 40px 40px;
        }
    </style>
</head>
<body>
    <div class = "box">
        <p class="box1">CSS Box-model property</p>
        <h1>Content Area</h1>
    </div>
</body>
</html>
